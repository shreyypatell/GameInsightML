<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}GameInsight ML{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
</head>
<body>
<nav class="navbar">
  <div class="nav-inner">
    <a href="/" class="brand">
      <span class="brand-mark">GI</span>
      <span class="brand-text">GameInsight<em>ML</em></span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="menu">
      <span></span><span></span><span></span>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="/" class="{{ 'active' if request.path == '/' else '' }}">Home</a>
      <a href="/dataset" class="{{ 'active' if request.path == '/dataset' else '' }}">Dataset</a>
      <a href="/eda" class="{{ 'active' if request.path == '/eda' else '' }}">EDA</a>
      <a href="/regression" class="{{ 'active' if request.path == '/regression' else '' }}">Regression</a>
      <a href="/classification" class="{{ 'active' if request.path == '/classification' else '' }}">Classification</a>
      <a href="/comparison" class="{{ 'active' if request.path == '/comparison' else '' }}">Comparison</a>
      <a href="/manual-predict" class="{{ 'active' if request.path == '/manual-predict' else '' }}">Predict</a>
      <a href="/upload-predict" class="{{ 'active' if request.path == '/upload-predict' else '' }}">Upload CSV</a>
      <a href="/about" class="{{ 'active' if request.path == '/about' else '' }}">About</a>
    </div>
  </div>
</nav>

<div id="toastBox" class="toast-box"></div>

<main class="page-wrap">
{% block content %}{% endblock %}
</main>

<footer class="site-footer">
  <p>Copyright &copy; 2026 GameInsightML.</p>
</footer>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
